  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

transform:none;letter-spacing:0;color:#5C655C\">(opcional)<\u002Fspan><\u002Flabel><input placeholder=\"R$ 14.000\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:13px;color:#F2F4F1;font-size:14px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:20px\">\n            <label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A;margin-bottom:8px\">Fotos da moto<\u002Flabel>\n            <div style=\"border:1px dashed rgba(255,255,255,.18);border-radius:3px;padding:30px;text-align:center;background:#0D0F0D\">\n              <div style=\"font:700 14px/1.3 Archivo,sans-serif;color:#C3C9C1\">Arraste até 8 fotos aqui<\u002Fdiv>\n              <div style=\"font:500 12px/1.4 Barlow,sans-serif;color:#79817A;margin-top:6px\">Frente, lateral, painel e documento — melhora a avaliação<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px\">\n            <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A;margin-bottom:8px\">Seu nome<\u002Flabel><input placeholder=\"Nome completo\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:13px;color:#F2F4F1;font-size:14px\"><\u002Fdiv>\n            <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A;margin-bottom:8px\">WhatsApp<\u002Flabel><input placeholder=\"(49) 9 9811-2215\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:13px;color:#F2F4F1;font-size:14px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:flex;gap:10px;align-items:flex-start;margin-top:18px;cursor:pointer\">\n            <span style=\"width:16px;height:16px;border-radius:2px;border:1px solid rgba(255,255,255,.24);margin-top:2px;display:block\"><\u002Fspan>\n            <span style=\"font:400 13px/1.5 Barlow,sans-serif;color:#9AA39A\">Autorizo o contato da Rafa Motos e o tratamento dos meus dados conforme a Política de Privacidade (LGPD).<\u002Fspan>\n          <\u002Flabel>\n          <button style=\"margin-top:22px;width:100%;background:var(--g,#4CD62B);color:#07120A;border:0;border-radius:3px;padding:17px;font:800 14px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#8CF06E\">Enviar para avaliação<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <aside style=\"background:#121412;border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:26px;position:sticky;top:calc(var(--bar-h,37px) + 71px)\">\n        <h3 style=\"font:800 18px/1.2 Archivo,sans-serif;margin:0 0 16px\">Como funciona<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div><div style=\"font:800 12px/1 Archivo,sans-serif;color:var(--g,#4CD62B);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Avaliação<\u002Fdiv><div style=\"font:400 14px/1.6 Barlow,sans-serif;color:#9AA39A\">Analisamos tabela, estado e procura da região.<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font:800 12px/1 Archivo,sans-serif;color:var(--g,#4CD62B);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Proposta<\u002Fdiv><div style=\"font:400 14px/1.6 Barlow,sans-serif;color:#9AA39A\">Você recebe o valor de compra e o de troca — sempre maior.<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font:800 12px/1 Archivo,sans-serif;color:var(--g,#4CD62B);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px\">Documentação<\u002Fdiv><div style=\"font:400 14px/1.6 Barlow,sans-serif;color:#9AA39A\">Cuidamos da transferência. Você sai com a moto nova.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.07)\">\n          <div style=\"font:500 13px/1.6 Barlow,sans-serif;color:#9AA39A\">Prefere resolver por mensagem?<\u002Fdiv>\n          <button style=\"margin-top:12px;width:100%;background:#1A1D1A;border:1px solid rgba(255,255,255,.16);color:#F2F4F1;border-radius:3px;padding:14px;font:800 13px/1 Archivo,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer\">Chamar no WhatsApp<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFin }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1280px;margin:0 auto;padding:40px 24px 72px\">\n    <div style=\"font:700 11px/1 Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--g,#4CD62B)\">Financiamento<\u002Fdiv>\n    <h1 style=\"font:800 40px/1 Archivo,sans-serif;letter-spacing:-.02em;margin:12px 0 10px\">Simulador de parcelas<\u002Fh1>\n    <p style=\"font:400 16px/1.6 Barlow,sans-serif;color:#9AA39A;margin:0 0 30px;max-width:56ch\">Valores estimados para orientação. A proposta final depende da análise de crédito da financeira.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start\">\n      <div style=\"background:#121412;border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:32px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px\">\n          <label style=\"font:600 11px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A\">Valor da moto<\u002Flabel>\n          <span style=\"font:800 24px/1 Archivo,sans-serif;color:#F2F4F1\">{{ fin.valorFmt }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"5000\" max=\"80000\" step=\"500\" value=\"{{ fin.valor }}\" sc-camel-on-change=\"{{ setValor }}\" style=\"width:100%\">\n        <div style=\"display:flex;justify-content:space-between;font:500 11px/1 Barlow,sans-serif;color:#5C655C;margin-top:8px\">‌<span>R$ 5.000<\u002Fspan><span>R$ 80.000<\u002Fspan><\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 12px\">\n          <label style=\"font:600 11px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A\">Entrada <span style=\"color:var(--g,#4CD62B)\">{{ fin.entradaPct }}<\u002Fspan><\u002Flabel>\n          <span style=\"font:800 24px/1 Archivo,sans-serif;color:#F2F4F1\">{{ fin.entradaFmt }}<\u002Fspan>\n        <\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"40000\" step=\"500\" value=\"{{ fin.entrada }}\" sc-camel-on-change=\"{{ setEntrada }}\" style=\"width:100%\">\n\n        <div style=\"margin:32px 0 12px\"><label style=\"font:600 11px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A\">Número de parcelas<\u002Flabel><\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ fin.opcoes }}\" as=\"o\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ o.go }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:34px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A;margin-bottom:8px\">Nome<\u002Flabel><input placeholder=\"Nome completo\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:13px;color:#F2F4F1;font-size:14px\"><\u002Fdiv>\n          <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#79817A;margin-bottom:8px\">WhatsApp<\u002Flabel><input placeholder=\"(49) 9 9811-2215\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:13px;color:#F2F4F1;font-size:14px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <aside style=\"position:sticky;top:calc(var(--bar-h,37px) + 71px);display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:var(--g,#4CD62B);color:#07120A;border-radius:4px;padding:28px\">\n          <div style=\"font:700 11px/1 Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.72\">Parcela estimada<\u002Fdiv>\n          <div style=\"font:900 46px/1 Archivo,sans-serif;letter-spacing:-.02em;margin:12px 0 4px\">{{ fin.parcelaFmt }}<\u002Fdiv>\n          <div style=\"font:600 14px/1.4 Barlow,sans-serif;color:rgba(7,18,10,.75)\">{{ fin.parcelas }} parcelas fixas · 1,79% a.m.<\u002Fdiv>\n          <div style=\"margin-top:22px;padding-top:18px;border-top:1px solid rgba(7,18,10,.2);display:flex;flex-direction:column;gap:9px\">\n            <div style=\"display:flex;justify-content:space-between;font:600 13px/1 Barlow,sans-serif\"><span style=\"color:rgba(7,18,10,.7)\">Valor financiado<\u002Fspan><span>{{ fin.financiadoFmt }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font:600 13px/1 Barlow,sans-serif\"><span style=\"color:rgba(7,18,10,.7)\">Total a prazo<\u002Fspan><span>{{ fin.totalFmt }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"margin-top:22px;width:100%;background:#07120A;color:#F2F4F1;border:0;border-radius:3px;padding:16px;font:800 13px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer\">Enviar simulação<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#121412;border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:20px\">\n          <p style=\"font:400 12px/1.6 Barlow,sans-serif;color:#79817A;margin:0\">Simulação meramente informativa, sem caráter de oferta de crédito. Sujeita a análise e às condições da financeira parceira.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isContato }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <section style=\"border-bottom:1px solid rgba(255,255,255,.08)\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:46px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:center\">\n        <div>\n          <div style=\"font:700 11px/1 Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--g,#4CD62B)\">Desde 2014 em Videira<\u002Fdiv>\n          <h1 style=\"font:800 42px/1 Archivo,sans-serif;letter-spacing:-.02em;margin:14px 0 16px\">Mecânica, peças e vendas no mesmo lugar<\u002Fh1>\n          <p style=\"font:400 16px/1.7 Barlow,sans-serif;color:#9AA39A;margin:0;max-width:50ch\">A Rafa Motos nasceu como oficina e virou loja. Toda moto do estoque passa pela nossa bancada antes de ir para a vitrine — é por isso que damos garantia de 90 dias.<\u002Fp>\n          <div style=\"display:flex;gap:36px;margin-top:30px\">\n            <div><div style=\"font:900 34px/1 Archivo,sans-serif;color:var(--g,#4CD62B)\">1.200+<\u002Fdiv><div style=\"font:500 12px/1.4 Barlow,sans-serif;color:#79817A;margin-top:6px\">motos vendidas<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font:900 34px/1 Archivo,sans-serif;color:var(--g,#4CD62B)\">12 anos<\u002Fdiv><div style=\"font:500 12px/1.4 Barlow,sans-serif;color:#79817A;margin-top:6px\">de oficina<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font:900 34px/1 Archivo,sans-serif;color:var(--g,#4CD62B)\">4,9<\u002Fdiv><div style=\"font:500 12px/1.4 Barlow,sans-serif;color:#79817A;margin-top:6px\">no Google<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"aspect-ratio:4/3;background-image:repeating-linear-gradient(135deg,#191d19 0 14px,#141714 14px 28px);border:1px solid rgba(255,255,255,.08);border-radiu 600 10px/1 Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#79817A;margin-bottom:7px\">Telefone<\u002Flabel><input value=\"49 3565-5098\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:11px;color:#F2F4F1;font-size:13px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;align-items:center\">\n            <img src=\"acc679ba-3fe5-4b2c-bad1-807b05a9bee3\" alt=\"Logo atual\" style=\"height:64px;width:auto;border-radius:3px;display:block\">\n            <div style=\"flex:1 1 200px;border:1px dashed rgba(255,255,255,.18);border-radius:3px;padding:18px;text-align:center;background:#0D0F0D;font:600 12px/1.4 Barlow,sans-serif;color:#79817A\">Substituir logo · PNG ou SVG<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#121412;border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:22px\">\n          <div style=\"font:800 14px/1 Archivo,sans-serif;letter-spacing:.04em;text-transform:uppercase;margin-bottom:18px\">Endereço e horários<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px\">\n            <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#79817A;margin-bottom:7px\">Rua e número<\u002Flabel><input value=\"Rua Exemplo, 1200\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:11px;color:#F2F4F1;font-size:13px\"><\u002Fdiv>\n            <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#79817A;margin-bottom:7px\">Cidade / UF<\u002Flabel><input value=\"Videira / SC\" style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:11px;color:#F2F4F1;font-size:13px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px\">\n            <sc-for list=\"{{ horarios }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font:500 13px/1 Barlow,sans-serif;color:#C3C9C1\"><span>{{ h.dia }}<\u002Fspan><span style=\"color:{{ h.cor }}\">{{ h.hora }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#121412;border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:22px\">\n          <div style=\"font:800 14px/1 Archivo,sans-serif;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px\">Tema<\u002Fdiv>\n          <p style=\"font:400 12px/1.6 Barlow,sans-serif;color:#5C655C;margin:0 0 16px\">Cores aplicadas em todo o site público.<\u002Fp>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <div style=\"flex:1 1 100px\"><div style=\"height:42px;border-radius:3px;background:var(--g,#4CD62B);border:1px solid rgba(255,255,255,.1)\"><\u002Fdiv><div style=\"font:600 11px/1 Barlow,sans-serif;color:#79817A;margin-top:7px\">Primária<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 100px\"><div style=\"height:42px;border-radius:3px;background:#0A0B0A;border:1px solid rgba(255,255,255,.14)\"><\u002Fdiv><div style=\"font:600 11px/1 Barlow,sans-serif;color:#79817A;margin-top:7px\">Fundo<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1 1 100px\"><div style=\"height:42px;border-radius:3px;background:#121412;border:1px solid rgba(255,255,255,.14)\"><\u002Fdiv><div style=\"font:600 11px/1 Barlow,sans-serif;color:#79817A;margin-top:7px\">Superfície<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px\">\n            <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#79817A;margin-bottom:7px\">Fonte títulos<\u002Flabel><sc-raw-select style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:11px;color:#F2F4F1;font-size:13px\"><option>Archivo<\u002Foption><option>Barlow Condensed<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n            <div><label style=\"display:block;font:600 10px/1 Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#79817A;margin-bottom:7px\">Fonte texto<\u002Flabel><sc-raw-select style=\"width:100%;background:#0A0B0A;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:11px;color:#F2F4F1;font-size:13px\"><option>Barlow<\u002Foption><option>Archivo<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#121412;border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:22px\">\n          <div style=\"font:800 14px/1 Archivo,sans-serif;letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px\">Módulos<\u002Fdiv>\n          <sc-for list=\"{{ modulos }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)\">\n              <div style=\"min-width:0;flex:1\"><div style=\"font:700 14px/1.2 Archivo,sans-serif\">{{ m.nome }}<\u002Fdiv><div style=\"font:500 12px/1.4 Barlow,sans-serif;color:#79817A\">{{ m.desc }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"{{ m.trilho }}\"><span style=\"{{ m.bolinha }}\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button style=\"margin-top:20px;width:100%;background:var(--g,#4CD62B);color:#07120A;border:0;border-radius:3px;padding:13px;font:800 12px/1 Archivo,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer\">Salvar configurações<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentGreen&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4CD62B&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#4CD62B&quot;,&quot;#38C172&quot;,&quot;#7BE01F&quot;,&quot;#20D9A0&quot;],&quot;section&quot;:&quot;Marca&quot;},&quot;adminDensity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;confortável&quot;,&quot;options&quot;:[&quot;confortável&quot;,&quot;compacta&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Admin&quot;}}\">\nconst BRL = n => 'R$ ' + Math.round(n).toLocaleString('pt-BR');\nconst pmt = (pv, i, n) => pv <= 0 ? 0 : pv * (i * Math.pow(1 + i, n)) / (Math.pow(1 + i, n) - 1);\n\nconst MOTOS = [\n  { nome: 'Honda CB 500F', versao: 'ABS · Manual', ano: '2023', km: '8.400 km', cc: '471cc', preco: 36900, precoAntigo: 39900, tag: 'Oferta' },\n  { nome: 'Yamaha Fazer 250', versao: 'ABS · Manual', ano: '2022', km: '12.100 km', cc: '249cc', preco: 21500, precoAntigo: 0, tag: 'Seminova' },\n  { nome: 'Honda CG 160 Titan', versao: 'Start · Manual', ano: '2021', km: '18.900 km', cc: '162cc', preco: 14300, precoAntigo: 0, tag: 'Revisada' },\n  { nome: 'Yamaha MT-03', versao: 'ABS · Manual', ano: '2022', km: '9.700 km', cc: '321cc', preco: 32800, precoAntigo: 0, tag: 'Seminova' },\n  { nome: 'Honda Biz 125', versao: 'ES · Automática', ano: '2023', km: '6.200 km', cc: '125cc', preco: 13900, precoAntigo: 15200, tag: 'Oferta' },\n  { nome: 'Suzuki GSX-S750', versao: 'ABS · Manual', ano: '2020', km: '21.400 km', cc: '749cc', preco: 44900, precoAntigo: 0, tag: 'Reservada' }\n];\n\nclass Component extends DCLogic {\n  state = { screen: 'home', valor: 36900, entrada: 7400, parcelas: 48, precoFiltro: 35000, img: 0 };\n\n  componentDidMount() {\n    this.applyAccent();\n    this._measure = () => {\n      const b = document.getElementById('protobar');\n      if (b) document.documentElement.style.setProperty('--bar-h', b.getBoundingClientRect().height + 'px');\n    };\n    this._measure();\n    window.addEventListener('resize', this._measure);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this._measure); }\n  componentDidUpdate() { this.applyAccent(); if (this._measure) this._measure(); }\n  applyAccent() {\n    const g = this.props.accentGreen || '#4CD62B';\n    document.documentElement.style.setProperty('--g', g);\n  }\n\n  go(s) { return () => { this.setState({ screen: s }); window.scrollTo(0, 0); }; }\n\n  renderVals() {\n    const s = this.state.screen;\n    const g = this.props.accentGreen || '#4CD62B';\n    const nav = [\n      ['home', 'Home'], ['estoque', 'Estoque'], ['detalhe', 'Moto'], ['vender', 'Vender'],\n      ['fin', 'Financiamento'], ['contato', 'Sobre · Contato'],\n      ['adm', 'Admin · Painel'], ['admMotos', 'Admin · Motos'], ['admLeads', 'Admin · Leads'],\n      ['admMarcas', 'Admin · Marcas'], ['admUsuarios', 'Admin · Usuários'], ['admConfig', 'Admin · Config']\n    ];\n    const chip = on => 'background:' + (on ? g : 'transparent') + ';color:' + (on ? '#07120A' : '#9AA39A') +\n      ';border:1px solid ' + (on ? g : 'rgba(255,255,255,.16)') + ';border-radius:2px;padding:6px 10px;cursor:pointer;font:700 11px/1 Archivo,sans-serif;letter-spacing:.04em';\n\n    const tagCor = t => t === 'Oferta' ? [g, '#07120A'] : t === 'Reservada' ? ['#E8B33C', '#1A1206'] : ['rgba(0,0,0,.6)', '#F2F4F1'];\n    const dense = (this.props.adminDensity || 'confortável') === 'compacta';\n\n    const motos = MOTOS.map((m, i) => {\n      const [bg, fg] = tagCor(m.tag);\n      return {\n        ...m, tagBg: bg, tagFg: fg,\n        preco: BRL(m.preco),\n        precoAntigo: m.precoAntigo ? BRL(m.precoAntigo) : '',\n        parcela: '48x de ' + BRL(pmt(m.preco * 0.8, 0.0179, 48)),\n        go: this.go('detalhe')\n      };\n    });\n\n    const valor = this.state.valor, entrada = Math.min(this.state.entrada, valor * 0.9), n = this.state.parcelas;\n    const financiado = valor - entrada;\n    const parcela = pmt(financiado, 0.0179, n);\n\n    return {\n      isPublic: !s.startsWith('adm'),\n      isAdmin: s.startsWith('adm'),\n      isHome: s === 'home', isEstoque: s === 'estoque', isDetalhe: s === 'detalhe',\n      isVender: s === 'vender', isFin: s === 'fin', isContato: s === 'contato',\n      isAdmDash: s === 'adm', isAdmMotos: s === 'admMotos', isAdmLeads: s === 'admLeads',\n      isAdmMarcas: s === 'admMarcas', isAdmUsuarios: s === 'admUsuarios', isAdmConfig: s === 'admConfig',\n      showNovaMoto: s === 'adm' || s === 'admMotos',\n      adminTitulo: { adm: 'Painel', admMotos: 'Estoque', admLeads: 'Leads', admMarcas: 'Marcas', admUsuarios: 'Usuários', admConfig: 'Configurações da loja' }[s] || 'Painel',\n\n      navItems: nav.map(([id, label]) => ({ label, go: this.go(id), style: chip(s === id) })),\n      adminNav: [['adm', 'Painel'], ['admMotos', 'Motos'], ['admLeads', 'Leads'], ['admMarcas', 'Marcas'], ['admUsuarios', 'Usuários'], ['admConfig', 'Configurações']]\n        .map(([id, label]) => ({\n          label, go: this.go(id),\n          style: 'text-align:left;background:' + (s === id ? 'rgba(76,214,43,.12)' : 'transparent') +\n            ';color:' + (s === id ? g : '#9AA39A') +\n            ';border:0;border-radius:3px;padding:10px 12px;cursor:pointer;font:700 13px/1 Archivo,sans-serif;letter-spacing:.03em'\n        })),\n\n      marcasAdmin: [['Honda', 14, true], ['Yamaha', 11, true], ['Suzuki', 6, true], ['Kawasaki', 4, true], ['Shineray', 3, false], ['Dafra', 0, false]]\n        .map(([nome, qtd, ativa]) => ({\n          nome, qtd, slug: nome.toLowerCase(),\n          estado: ativa ? 'Ativa' : 'Inativa',\n          estBg: ativa ? 'rgba(76,214,43,.14)' : 'rgba(255,255,255,.07)',\n          estFg: ativa ? g : '#9AA39
